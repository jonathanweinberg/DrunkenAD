name: PowerShell CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse PowerShell files
        shell: pwsh
        run: ./scripts/Test-DrunkenADSyntax.ps1

      - name: Run unit tests
        shell: pwsh
        run: ./tests/Invoke-DrunkenADTests.ps1
