name: PowerShell CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      PESTER_RESULT_PATH: pester-results.xml
      PESTER_VERSION: 5.7.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $psGallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if ($psGallery) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          else {
              Register-PSRepository -Default -InstallationPolicy Trusted
          }
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module Pester -ListAvailable |
              Sort-Object Version -Descending |
              Select-Object -First 1 Name, Version, Path |
              Format-List

      - name: Validate module manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./DrunkenAD/DrunkenAD.psd1 |
              Select-Object Name, Version, PowerShellVersion, RootModule |
              Format-List

      - name: Parse PowerShell files
        shell: pwsh
        run: ./scripts/Test-DrunkenADSyntax.ps1

      - name: Run release-readiness checks
        shell: pwsh
        run: |
          $PSDefaultParameterValues['Invoke-DrunkenADTests.ps1:TestResultPath'] = $env:PESTER_RESULT_PATH
          ./scripts/Test-DrunkenADRelease.ps1

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: ${{ env.PESTER_RESULT_PATH }}
          if-no-files-found: ignore
          retention-days: 14

  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      PESTER_VERSION: 5.7.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $psGallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if ($psGallery) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          else {
              Register-PSRepository -Default -InstallationPolicy Trusted
          }
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run release-readiness checks in Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion -notlike '5.1.*' -or $PSVersionTable.PSEdition -ne 'Desktop') {
              throw "Expected Windows PowerShell 5.1 Desktop but found $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)."
          }
          $pesterManifest = Get-Module Pester -ListAvailable |
              Where-Object Version -eq ([version]$env:PESTER_VERSION) |
              Select-Object -First 1 -ExpandProperty Path
          if ([string]::IsNullOrWhiteSpace($pesterManifest)) {
              throw "Pester $env:PESTER_VERSION was not found."
          }
          .\scripts\Test-DrunkenADRelease.ps1 -PesterManifestPath $pesterManifest
