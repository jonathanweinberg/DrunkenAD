name: PowerShell CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      PESTER_RESULT_PATH: pester-results.xml
      PESTER_VERSION: 5.7.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $psGallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if ($psGallery) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          else {
              Register-PSRepository -Default -InstallationPolicy Trusted
          }
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module Pester -ListAvailable |
              Sort-Object Version -Descending |
              Select-Object -First 1 Name, Version, Path |
              Format-List

      - name: Validate module manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./DrunkenAD/DrunkenAD.psd1 |
              Select-Object Name, Version, PowerShellVersion, RootModule |
              Format-List

      - name: Parse PowerShell files
        shell: pwsh
        run: ./scripts/Test-DrunkenADSyntax.ps1

      - name: Run unit tests
        shell: pwsh
        run: ./tests/Invoke-DrunkenADTests.ps1 -Output Detailed -TestResultPath $env:PESTER_RESULT_PATH

      - name: Run release-readiness checks
        shell: pwsh
        run: ./scripts/Test-DrunkenADRelease.ps1

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: ${{ env.PESTER_RESULT_PATH }}
          if-no-files-found: ignore
          retention-days: 14
